# ============================================
# Chatbot Dev (chatbot-dev.sourri.com)
# Reverse-proxy → Apache on host port 8091
# Apache serves frontend + proxies /api/ to chatbot backend :8183
#
# NOTE: When adding a NEW domain to this reverse-proxy, you must also:
#   1. Issue a cert:  sudo certbot certonly --standalone -d <domain>
#   2. Copy cert to ssl mount:  see deploy hook below
#   3. Add domain to /etc/letsencrypt/renewal-hooks/deploy/copy-to-nginx.sh
#   4. Create ssl dir:  mkdir -p ~/workspace/applications/reverse-proxy/ssl/<domain>
#   5. Reload nginx:  docker exec reverse-proxy-nginx-1 nginx -s reload
# ============================================

upstream chatbot_dev {
    server host.docker.internal:8091 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name chatbot-dev.sourri.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name chatbot-dev.sourri.com;

    ssl_certificate     /etc/nginx/ssl/chatbot-dev.sourri.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/chatbot-dev.sourri.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    location / {
        proxy_pass http://chatbot_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check
    location /health {
        proxy_pass http://chatbot_dev/health;
        access_log off;
    }
}
