# ============================================
# Glavac Contracting (contractor.sourri.com)
# Reverse-proxy → Apache on host port 8092
# Static Parcel build — .htaccess handles clean URLs, caching, security headers
# ============================================

upstream contractor {
    server host.docker.internal:8092 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name contractor.sourri.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name contractor.sourri.com;

    ssl_certificate     /etc/nginx/ssl/contractor.sourri.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/contractor.sourri.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    location / {
        proxy_pass http://contractor;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://contractor/health;
        access_log off;
    }
}