# ============================================
# Yanalkamal Dev Routes (Apache Backend)
# ============================================
upstream yanalkamal_dev {
    server host.docker.internal:8082 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name dev.yanalkamal.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name dev.yanalkamal.com;
    
    ssl_certificate /etc/nginx/ssl/dev.yanalkamal.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dev.yanalkamal.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;
    
    location / {
        proxy_pass http://yanalkamal_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
