# HTTP → HTTPS redirect
server {
    listen 80;
    server_name dev.sourri.com;
    return 301 https://$host$request_uri;
}

# HTTPS with SSL termination
server {
    listen 443 ssl;
    server_name dev.sourri.com;

    ssl_certificate     /etc/nginx/ssl/dev.sourri.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dev.sourri.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # API calls go directly to the backend container (bypasses Apache)
    location /api/ {
        proxy_pass http://host.docker.internal:8089;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Frontend served by Apache on port 80
    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://apiportfolio-dev:80;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/api-portfolio-access.log;
    error_log /var/log/nginx/api-portfolio-error.log;
}
