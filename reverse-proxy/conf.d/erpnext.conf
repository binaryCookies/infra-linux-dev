# ============================================
# ERPNext/Frappe Routes
# ============================================
#upstream erpnext {
#    server frappe_docker-frontend-1:8080 max_fails=3 fail_timeout=30s;
#    keepalive 32;
#}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name erp.sourri.com www.erp.sourri.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl; 
    http2 on;
    server_name erp.sourri.com www.erp.sourri.com;
    
    ssl_certificate /etc/nginx/ssl/erp.sourri.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/erp.sourri.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;
    
    # ERPNext requires these specific settings
    client_max_body_size 50M;
    
    location / {
       resolver 127.0.0.11 valid=30s;
       set $upstream http://frappe_docker-frontend-1:8080;
       proxy_pass $upstream;
	
 #	proxy_pass http://erpnext;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts for ERPNext operations
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # WebSocket support for Frappe
    location /socket.io {
#        proxy_pass http://erpnext;
	resolver 127.0.0.11 valid=30s;
	set $upstream http://frappe_docker-frontend-1:8080;
	proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
