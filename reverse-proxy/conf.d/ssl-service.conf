# ============================================
# SSL Service API Routes
# ============================================
upstream ssl_service {
    # Docker DNS: <folder>-<service>-<replica>
    # Adjust to match: docker compose ps
    server ssl-service-ssl-service-1:8888 max_fails=3 fail_timeout=30s;
    
    keepalive 32;
}

server {
    listen 80;
    server_name api.local localhost;
    
    # Debug endpoint
    location /debug/ {
        proxy_pass http://ssl_service/debug/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://ssl_service/health;
        access_log off;
    }
    
    # SSL service API routes
    location /api/certificates/ {
        proxy_pass http://ssl_service/api/certificates/;
        
        # Connection optimization
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-running cert operations
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        proxy_buffering off;
    }
    
    # Root
    location / {
        return 200 '{"service":"reverse-proxy","status":"running"}';
        add_header Content-Type application/json;
    }
}
