# ============================================
# SHARED REVERSE PROXY
# Routes traffic to multiple backend services
# ============================================

services:
  nginx:
    image: nginx:1.25-alpine
    ulimits:
      nofile:
        soft: 2048
        hard: 2048
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
      - /var/www/certbot:/var/www/certbot:ro
    
    # Enable access to host services (Apache on port 8081)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    networks:
      - proxy-network
      - frappe_docker_frappe_network
      - backend-chatbot-network
    
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3
    
    restart: unless-stopped
    
    labels:
      com.service.name: "reverse-proxy"
      com.service.description: "Shared nginx reverse proxy for all services"

networks:
  proxy-network:
    name: proxy-network
    driver: bridge
  frappe_docker_frappe_network:
    external: true
  backend-chatbot-network:
    external: true

volumes:
  nginx-cache:
  nginx-logs:
