# ============================================
# Miniature Spork Application
# ============================================
upstream miniature_spork {
    # Apache on high port
    server host.docker.internal:8084 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    # Update these domains based on audit results
    server_name staging.sourri.com;
    
    # Standard proxy settings
    location / {
        proxy_pass http://miniature_spork;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Disable buffering for better real-time performance
        proxy_buffering off;
        
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Static assets (if applicable)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://miniature_spork;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Cache static assets
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    access_log /var/log/nginx/miniature-spork-access.log;
    error_log /var/log/nginx/miniature-spork-error.log;
}

