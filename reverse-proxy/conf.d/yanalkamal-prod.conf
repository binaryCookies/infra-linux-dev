# ============================================
# Yanalkamal Production Routes (Apache Backend)
# ============================================
upstream yanalkamal_prod {
    server host.docker.internal:8083 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name yanalkamal.com www.yanalkamal.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name yanalkamal.com www.yanalkamal.com;
    
    ssl_certificate /etc/nginx/ssl/yanalkamal.com-0001/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/yanalkamal.com-0001/privkey.pem;
    include /etc/nginx/ssl-params.conf;
    
    location / {
        proxy_pass http://yanalkamal_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
