# =============================================================================
# SSL SERVICE — IaC Deployment Compose
#
# Pull-only: image must be pre-built and pushed from the app repo.
# Prerequisite: cd ~/workspace/applications/ssl-service && make build-push
#
# Networks managed externally by: infrastructure/scripts/init-networks.sh
# =============================================================================

services:
  ssl-service:
    image: ghcr.io/binarycookies/ssl-service:${IMAGE_TAG:-latest}

    env_file:
      - .env

    environment:
      NODE_ENV: production
      ACME_DIRECTORY_URL: https://acme-v02.api.letsencrypt.org/directory

    volumes:
      - certs-data:/app/certs
      - logs-data:/app/logs

    # No port exposure — access is via nginx on the shared proxy-network
    networks:
      - proxy-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8888/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    restart: always

# =============================================================================
# NETWORKS — external (created by infrastructure/scripts/init-networks.sh)
# =============================================================================
networks:
  proxy-network:
    external: true

# =============================================================================
# VOLUMES — persistent across restarts
# =============================================================================
volumes:
  certs-data:
    driver: local
  logs-data:
    driver: local
